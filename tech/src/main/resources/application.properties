# Conexão com o Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/chronos_db?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=yes&characterEncoding=UTF-8&useTimezone=true&serverTimezone=UTC
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

security.jwt.secret=ChronosSecretKeyForJwtTokenGenerationChangeInProduction123456
security.jwt.expiration-ms=86400000

# AWS S3 Configuration
aws.s3.bucket=
aws.region=us-east-1
aws.access-key=SUA_ACCESS_KEY_AQUI_QUE_ESTA_NO_LABS
aws.secret-key=SUA_SECRET_KEY_AQUI_QUE_ESTA_NO_LABS
aws.session-token=SEU_SESSION_TOKEN_AQUI_QUE_ESTA_NO_LABS

# Crypto Configuration
crypto.encryption.key=ChronosBiometricEncryptionKeyChangeInProduction32!
crypto.encryption.algorithm=AES
crypto.encryption.mode=GCM