# Conexão com o Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/chronos_db?allowPublicKeyRetrieval=true&sslMode=REQUIRED&useUnicode=yes&characterEncoding=UTF-8&useTimezone=true&serverTimezone=UTC

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# Chave JWT fornecida pelo ambiente
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=86400000