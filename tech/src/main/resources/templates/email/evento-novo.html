<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo evento</title>
</head>
<body style="margin:0;padding:0;background:#f3f5f8;font-family:Arial,Helvetica,sans-serif;color:#202938;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f5f8;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
        <tr><td style="background:#173b57;padding:28px 32px;color:#ffffff;">
          <p style="margin:0 0 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#c8d9e6;">Chronos · Eventos</p>
          <h1 style="margin:0;font-size:25px;line-height:1.3;">Um novo evento foi cadastrado</h1>
        </td></tr>
        <tr><td style="padding:30px 32px;">
          <p style="margin:0 0 18px;font-size:16px;">Olá, {{nome_destinatario}}!</p>
          <h2 style="margin:0 0 12px;font-size:22px;color:#173b57;">{{titulo}}</h2>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.6;white-space:pre-line;">{{descricao}}</p>
          <table role="presentation" cellspacing="0" cellpadding="0" style="font-size:14px;line-height:1.8;">
            <tr><td style="padding-right:12px;font-weight:bold;">Data</td><td>{{data}}</td></tr>
            <tr><td style="padding-right:12px;font-weight:bold;">Horário</td><td>{{hora_inicio}} às {{hora_fim}}</td></tr>
            <tr><td style="padding-right:12px;font-weight:bold;">Local</td><td>{{local}}</td></tr>
          </table>
          <p style="margin:26px 0 0;font-size:14px;line-height:1.5;color:#596579;">Esperamos você!</p>
        </td></tr>
        <tr><td style="padding:18px 32px;background:#f8fafc;border-top:1px solid #e7ebf0;font-size:12px;color:#758195;">Mensagem automática enviada pelo Chronos.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
