spring.datasource.url=jdbc:h2:mem:chronos_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

security.jwt.secret=12345678901234567890123456789012
security.jwt.expiration-ms=86400000

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
chronos.email.rabbitmq.exchange=email.exchange
chronos.email.rabbitmq.routing-key=email.send
chronos.email.from=no-reply@chronos.local

aws.s3.bucket=test-bucket
aws.region=us-east-1
aws.access-key=test-access-key
aws.secret-key=test-secret-key
aws.session-token=test-session-token

crypto.encryption.key=ChronosBiometricEncryptionKeyChangeInProduction32!
crypto.encryption.algorithm=AES
crypto.encryption.mode=GCM
